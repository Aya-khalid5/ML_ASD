# ---------------------------------------------------------------------------
# ASD Screening Application — Docker Compose
#
# Start the whole stack with one command:
#   docker-compose up --build
#
# Services:
#   backend  -> FastAPI + trained model (http://localhost:8000)
#   frontend -> Next.js UI (http://localhost:3000)
# ---------------------------------------------------------------------------

services:
  backend:
    build:
      context: ./backend
    container_name: asd-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend directly, so the frontend container
        # needs the backend URL baked in at build time. Change this if your
        # backend runs somewhere else.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: asd-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

